<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghs Hub Bypassed Stuff</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
}

header{
    text-align:center;
    padding:60px 20px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:25px;
    max-width:800px;
    margin:auto;
}

.card{
    background:#1e293b;
    padding:25px;
    border-radius:15px;
    text-align:center;
}

.center-card{
    grid-column:1 / span 2;
    max-width:387px;
    width:100%;
    justify-self:center;
}

.btn{
    display:inline-block;
    background:#3b82f6;
    color:white;
    text-decoration:none;
    padding:12px 25px;
    border-radius:10px;
}

.btn:hover{
    background:#2563eb;
}
</style>
</head>

<body>

<header>
    <h1>Ghs Hub Bypassed Stuff</h1>
    <p>Browse decals, models, and public audios.</p>
</header>

<div class="cards">

    <div class="card">
        <h2>🎨 Decals</h2>
        <p>View and copy decal IDs.</p>
        <a href="decals.html" class="btn">Open Decals</a>
    </div>

    <div class="card">
        <h2>📦 Models</h2>
        <p>Browse Roblox models and assets.</p>
        <a href="models.html" class="btn">Open Models</a>
    </div>

    <div class="card center-card">
        <h2>🎵 Public Audios</h2>
        <p>Find public audio IDs.</p>
        <a href="audios.html" class="btn">Open Audios</a>
    </div>

</div>

</body>
</html>
