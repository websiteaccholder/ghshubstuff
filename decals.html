<style>

}

h1{
    text-align:center;
}

.back-btn{
    color:white;
    text-decoration:none;
}

.decal-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:20px;
    margin-top:30px;
}

.decal-card{
    background:#1e293b;
    padding:15px;
    border-radius:12px;
    text-align:center;
}

.decal-card img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:8px;
}

.decal-card button{
    width:100%;
    padding:10px;
    background:#3b82f6;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.decal-card button:hover{
    background:#2563eb;
}

/* Responsive Layout */
@media (max-width:1200px){
    .decal-grid{
        grid-template-columns:repeat(4,1fr);
    }
}

@media (max-width:900px){
    .decal-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media (max-width:600px){
    .decal-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media (max-width:400px){
    .decal-grid{
        grid-template-columns:1fr;
    }
}
</style>
